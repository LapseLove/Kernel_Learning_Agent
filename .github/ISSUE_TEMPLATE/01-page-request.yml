name: 请求一个技术学习页面
description: 提出一个想学懂的技术机制，邀请贡献者核查证据并制作学习材料。
title: "[Page Request] "
body:
  - type: input
    id: subject
    attributes:
      label: 想研究的对象
      description: 可以是 kernel、代码库、runtime、工具或 skill。
      placeholder: "例如：kern × vLLM、某个 attention kernel、PR 历史查询工具"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 希望读者学会什么判断？
      description: 说明你已掌握的背景和最想下钻的部分。
      placeholder: "例如：我了解调度，想看插件怎样借用缓存，以及何时重绑。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 已知场景与边界
      description: 例如版本、入口、输入、硬件或使用者角色。未知可留空。
  - type: textarea
    id: sources
    attributes:
      label: 已知来源
      description: 代码、PR、论文或官方说明。如有固定 SHA 请附上。
  - type: dropdown
    id: contribution
    attributes:
      label: 你希望怎样参与？
      options:
        - 我只提出问题，欢迎其他人认领
        - 我可以核查源码或提供材料
        - 我可以分析调用、建模或验证
        - 我可以制作页面草图或交互
        - 我已有草稿，希望共同完成
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: 希望其他人帮忙的具体部分
      description: 例如找到实际入口、核对资源归属、复查一个边界或测试页面。
